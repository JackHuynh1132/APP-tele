<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
    <title>J.HUYNH BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ══════════════════════════════════════
           SPLASH / LOADING SCREEN
           ══════════════════════════════════════ */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        /* Animated particles background */
        .particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #7c5cfc;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Glowing ring */
        .splash-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: relative;
            margin-bottom: 40px;
            z-index: 2;
        }

        .splash-ring::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(#7c5cfc, #5c3cdc, #9d7fff, transparent, #7c5cfc);
            animation: spinRing 2s linear infinite;
        }

        .splash-ring::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border-radius: 50%;
            background: #0a0a12;
        }

        .splash-ring-inner {
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #7c5cfc;
            text-shadow: 0 0 20px rgba(124, 92, 252, 0.5);
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        /* Glitch text */
        .splash-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            position: relative;
            z-index: 2;
            margin-bottom: 8px;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { text-shadow: 0 0 10px rgba(124,92,252,0.5); transform: translate(0); }
            91% { text-shadow: -2px 0 #ff0040, 2px 0 #0ff; transform: translate(-2px, 1px); }
            93% { text-shadow: 2px 0 #ff0040, -2px 0 #0ff; transform: translate(2px, -1px); }
            95% { text-shadow: -1px 0 #ff0040, 1px 0 #0ff; transform: translate(1px, 0); }
        }

        .splash-sub {
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 2;
            margin-bottom: 50px;
        }

        /* Progress bar */
        .progress-container {
            width: 200px;
            height: 3px;
            background: #1a1a2e;
            border-radius: 2px;
            overflow: hidden;
            z-index: 2;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c5cfc, #9d7fff, #7c5cfc);
            background-size: 200% 100%;
            border-radius: 2px;
            animation: progressShimmer 1s ease infinite;
            transition: width 0.3s ease;
        }

        @keyframes progressShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-text {
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            z-index: 2;
        }

        /* Splash fade out */
        #splash-screen.fade-out {
            animation: splashOut 0.6s ease forwards;
        }

        @keyframes splashOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); pointer-events: none; }
        }

        /* ══════════════════════════════════════
           LOGIN SCREEN
           ══════════════════════════════════════ */
        #login-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background image layer */
        .login-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* ── PUT YOUR IMAGE URL HERE ── */
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(2px) brightness(0.3);
            transform: scale(1.05);
            z-index: 0;
        }

        .login-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            animation: fadeSlideUp 0.6s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(124, 92, 252, 0.2);
            border-radius: 18px;
            padding: 28px 44px;
            text-align: center;
            margin-bottom: 36px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(124, 92, 252, 0.08);
        }

        .logo-box h1 {
            font-size: 24px;
            color: #7c5cfc;
            letter-spacing: 3px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .logo-box p {
            font-size: 11px;
            color: #666;
            letter-spacing: 2px;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cfc, #5c3cdc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            border: 3px solid #9d7fff;
            box-shadow: 0 0 30px rgba(124, 92, 252, 0.35);
            overflow: hidden;
            animation: avatarPulse 3s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(124, 92, 252, 0.3); }
            50% { box-shadow: 0 0 40px rgba(124, 92, 252, 0.6); }
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .user-id {
            font-size: 13px;
            color: #999;
            font-family: 'Courier New', monospace;
            background: rgba(20, 20, 40, 0.8);
            backdrop-filter: blur(10px);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(124, 92, 252, 0.15);
        }

        .login-btn {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            background: linear-gradient(135deg, #7c5cfc, #5c3cdc);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(124, 92, 252, 0.45);
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .login-btn:active {
            transform: scale(0.96);
            box-shadow: 0 3px 12px rgba(124, 92, 252, 0.3);
        }
</style>
</head>
<body>
